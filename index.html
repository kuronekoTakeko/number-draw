<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101216">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>NUMBER DRAW</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <!-- 追加した特殊7のスタイル。既存 style.css は変更しません -->
  <style>
    #top-screen { overflow-y: auto; }
    #top-screen .top-content { margin: auto 0; }
    .special-mode-button {
      grid-column: 1 / -1;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 9px 12px;
    }
    .special-mode-button .mode-subtitle {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .025em;
      opacity: .8;
    }
    .special-result-note {
      font-size: 12px;
      color: #aeb7c6;
      margin: 7px 0 0;
    }
    .result-number.special-top-number { color: #83d4bc; }
    @media (max-height: 700px) {
      .special-mode-button { min-height: 62px; }
    }
  </style>
</head>

<body>

  <main id="app">

    <!-- =========================
         TOP SCREEN
    ========================== -->

    <section id="top-screen" class="screen active">

      <div class="top-content">

        <div class="title-area">
          <p class="sub-title">Random Number Generator</p>
          <h1>NUMBER DRAW</h1>
        </div>

        <div class="setting-block">
          <p class="setting-title">NUMBERS</p>

          <div class="choice-row">

            <button
              class="choice-button mode-button active"
              data-mode="6"
            >
              6 NUMBERS
            </button>

            <button
              class="choice-button mode-button"
              data-mode="7"
            >
              7 NUMBERS
            </button>

            <button
              class="choice-button mode-button special-mode-button"
              type="button"
              data-mode="special7"
              aria-label="特殊7抽選。上位15から4個、残り22から3個"
            >
              <span>特殊7抽選</span>
              <span class="mode-subtitle">上位15個から4個 ＋ それ以外から3個</span>
            </button>

          </div>
        </div>

        <div class="setting-block">
          <p class="setting-title">DRAW COUNT</p>

          <div class="choice-row">

            <button
              class="choice-button count-button active"
              data-count="1"
            >
              1回
            </button>

            <button
              class="choice-button count-button"
              data-count="5"
            >
              5回
            </button>

          </div>
        </div>

        <button id="draw-button">
          抽選する
        </button>

        <!-- 学習用の統計分析画面へのリンク。元の抽せん機能には影響しません。 -->
        <a href="stats.html" style="display:block;width:100%;text-align:center;margin-top:14px;padding:10px;color:#d4dae2;text-decoration:underline;text-underline-offset:4px;font-size:15px;">
          ロト7の過去100回を分析する ↗
        </a>

      </div>

    </section>


    <!-- =========================
         DRAWING SCREEN
    ========================== -->

    <section id="drawing-screen" class="screen">

      <div class="drawing-content">

        <p class="drawing-label">
          DRAWING
        </p>

        <div id="drawing-text">
          抽選中...
        </div>

      </div>

    </section>


    <!-- =========================
         RESULT SCREEN
    ========================== -->

    <section id="result-screen" class="screen">

      <div class="result-content">

        <div class="result-header">

          <p class="sub-title">
            Random Number Generator
          </p>

          <h2>RESULT</h2>
          <p id="result-mode-label">
            NUMBER 6
          </p>
          <p id="special-result-note" class="special-result-note" hidden>
            緑色の4個が、上位15個から抽出した数字です
          </p>

        </div>

        <div id="result-list"></div>

        <div class="result-buttons">

          <button id="again-button">
            もう一度抽選
          </button>

          <button id="top-button">
            トップへ
          </button>

        </div>

      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
